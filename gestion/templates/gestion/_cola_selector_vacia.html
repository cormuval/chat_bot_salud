<section class="modal-panel" data-fragment-kind="selector-empty" data-selector-source-section="{{ seccion_origen }}" data-selector-destination-section="{{ seccion_destino }}" data-selector-row-action="{{ accion_fila }}">
  <header class="modal-header">
    <h2 data-dialog-focus tabindex="-1">No quedan casos pendientes</h2>
    <p>La cola del selector esta vacia para su alcance actual.</p>
  </header>
  <footer class="modal-actions">
    <button type="button" data-dialog-close>Cerrar</button>
  </footer>
</section>
